services:
  # Python Intelligence (auth, billing, AI, real-time)
  python-intelligence:
    build:
      context: apps/python-intelligence
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pegasus
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
    depends_on:
      - postgres
    restart: always

  # Rust Core (data-plane REST API)
  rust-core:
    build:
      context: apps/rust-core
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      - PY_INTELLIGENCE_URL=http://python-intelligence:8090
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/pegasus
      - RUST_PORT=8787
    depends_on:
      - postgres
      - python-intelligence
    restart: always

  # Postgres
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pegasus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  # Pegasus UI (Optional, if you want to host it containerized)
  # ui:
  #   build:
  #     context: apps/ui
  #     dockerfile: Dockerfile
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - rust-core

volumes:
  pgdata:
