name: Release

on:
  push:
    branches: [main]
    paths:
      - "apps/ui/public/changelogs/v*.json"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 0.8.0)"
        required: true
      title:
        description: "Release Title"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v1

      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --ignore-scripts

      - name: Generate Changelog Entry
        if: github.event_name == 'workflow_dispatch'
        run: bun scripts/generate-changelog-entry.js --version=${{ inputs.version }} --title="${{ inputs.title }}"

      - name: Sync to Neon
        run: bun run docs:migrate
        env:
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

      - name: Tag Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag -f v${{ inputs.version }}
          git push origin v${{ inputs.version }} --force
