[project]
name = "pegasus-intelligence"
version = "0.1.0"
description = "Pegasus AI, Auth, Billing & Real-time Service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "asyncpg>=0.30.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "stripe>=11.0.0",
    "python-socketio[asyncio-client]>=5.11.0",
    "openai>=1.55.0",
    "anthropic>=0.45.0",
    "google-genai>=1.0.0",
    "resend>=0.8.0",
    "croniter>=6.0.0",
]

[project.scripts]
pegasus-api = "app.main:run"

[tool.ruff]
line-length = 120
target-version = "py311"
